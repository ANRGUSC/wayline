apiVersion: wl.io/v1
kind: ODAGTemplate
metadata:
  name: wpf-heft-store
  namespace: wl-system
spec:
  description: "Wide-pipeline-flex \u2014 HEFT strict (spreadEpsilon=0)."
  scheduler: heft
  schedulerConfig:
    spreadEpsilon: 0
  profiling:
    enabled: true
    warmupRuns: 0
    minSamples: 2
    emaAlpha: 0.7
    maxSamples: 50
    runtimeSource: profiler
    bandwidthSource: external
  retention:
    maxRuns: 20
    data:
      policy: immediate
  defaults:
    runtime: 3
    dataSize: 50MB
  tasks:
  - name: source
    image: 192.168.1.163:5000/wl-multi-odag-task:latest
    command: &id009
    - python
    - task.py
    dependencies: []
    runtime: 3
    dataSize: 100MB
    resources:
      cpu: 200m
      memory: 128Mi
    constraints:
      nodeNames:
      - anrg-1
  - name: extract
    image: 192.168.1.163:5000/wl-multi-odag-task:latest
    command: &id002
    - python
    - task.py
    dependencies:
    - store-source
    runtime: 4
    dataSize: 50MB
    resources:
      cpu: 200m
      memory: 128Mi
    constraints:
      nodeNames:
      - anrg-3
      - anrg-4
      - anrg-5
  - name: scan
    image: 192.168.1.163:5000/wl-multi-odag-task:latest
    command: &id008
    - python
    - task.py
    dependencies:
    - store-source
    runtime: 4
    dataSize: 50MB
    resources:
      cpu: 200m
      memory: 128Mi
    constraints:
      nodeNames:
      - anrg-3
      - anrg-4
      - anrg-5
  - name: index
    image: 192.168.1.163:5000/wl-multi-odag-task:latest
    command: &id006
    - python
    - task.py
    dependencies:
    - store-source
    runtime: 4
    dataSize: 50MB
    resources:
      cpu: 200m
      memory: 128Mi
    constraints:
      nodeNames:
      - anrg-3
      - anrg-4
      - anrg-5
  - name: merge
    image: 192.168.1.163:5000/wl-multi-odag-task:latest
    command: &id007
    - python
    - task.py
    dependencies:
    - store-extract
    - store-scan
    - store-index
    runtime: 3
    dataSize: 100MB
    resources:
      cpu: 300m
      memory: 256Mi
    constraints:
      nodeNames:
      - anrg-6
      - anrg-7
      - anrg-8
  - name: filter-a
    image: 192.168.1.163:5000/wl-multi-odag-task:latest
    command: &id003
    - python
    - task.py
    dependencies:
    - store-merge
    runtime: 3
    dataSize: 30MB
    resources:
      cpu: 200m
      memory: 128Mi
    constraints:
      nodeNames:
      - anrg-6
      - anrg-7
      - anrg-8
  - name: filter-b
    image: 192.168.1.163:5000/wl-multi-odag-task:latest
    command: &id004
    - python
    - task.py
    dependencies:
    - store-merge
    runtime: 3
    dataSize: 30MB
    resources:
      cpu: 200m
      memory: 128Mi
    constraints:
      nodeNames:
      - anrg-6
      - anrg-7
      - anrg-8
  - name: filter-c
    image: 192.168.1.163:5000/wl-multi-odag-task:latest
    command: &id005
    - python
    - task.py
    dependencies:
    - store-merge
    runtime: 3
    dataSize: 30MB
    resources:
      cpu: 200m
      memory: 128Mi
    constraints:
      nodeNames:
      - anrg-6
      - anrg-7
      - anrg-8
  - name: aggregate
    image: 192.168.1.163:5000/wl-multi-odag-task:latest
    command: &id001
    - python
    - task.py
    dependencies:
    - store-filter-a
    - store-filter-b
    - store-filter-c
    runtime: 2
    dataSize: 10MB
    resources:
      cpu: 300m
      memory: 256Mi
    constraints:
      nodeNames:
      - anrg-6
      - anrg-7
      - anrg-8
  - name: output
    image: 192.168.1.163:5000/wl-multi-odag-task:latest
    command:
    - python
    - task.py
    dependencies:
    - store-aggregate
    runtime: 1
    dataSize: '0'
    resources:
      cpu: 100m
      memory: 64Mi
    constraints:
      nodeNames:
      - anrg-9
  - name: store-aggregate
    image: 192.168.1.163:5000/wl-multi-odag-task:latest
    command: *id001
    dependencies:
    - aggregate
    dataSize: 10MB
    runtime: 0
    resources:
      cpu: 100m
      memory: 256Mi
    constraints:
      nodeNames:
      - anrg-9
    type: data
  - name: store-extract
    image: 192.168.1.163:5000/wl-multi-odag-task:latest
    command: *id002
    dependencies:
    - extract
    dataSize: 50MB
    runtime: 0
    resources:
      cpu: 100m
      memory: 256Mi
    constraints:
      nodeNames:
      - anrg-9
    type: data
  - name: store-filter-a
    image: 192.168.1.163:5000/wl-multi-odag-task:latest
    command: *id003
    dependencies:
    - filter-a
    dataSize: 30MB
    runtime: 0
    resources:
      cpu: 100m
      memory: 256Mi
    constraints:
      nodeNames:
      - anrg-9
    type: data
  - name: store-filter-b
    image: 192.168.1.163:5000/wl-multi-odag-task:latest
    command: *id004
    dependencies:
    - filter-b
    dataSize: 30MB
    runtime: 0
    resources:
      cpu: 100m
      memory: 256Mi
    constraints:
      nodeNames:
      - anrg-9
    type: data
  - name: store-filter-c
    image: 192.168.1.163:5000/wl-multi-odag-task:latest
    command: *id005
    dependencies:
    - filter-c
    dataSize: 30MB
    runtime: 0
    resources:
      cpu: 100m
      memory: 256Mi
    constraints:
      nodeNames:
      - anrg-9
    type: data
  - name: store-index
    image: 192.168.1.163:5000/wl-multi-odag-task:latest
    command: *id006
    dependencies:
    - index
    dataSize: 50MB
    runtime: 0
    resources:
      cpu: 100m
      memory: 256Mi
    constraints:
      nodeNames:
      - anrg-9
    type: data
  - name: store-merge
    image: 192.168.1.163:5000/wl-multi-odag-task:latest
    command: *id007
    dependencies:
    - merge
    dataSize: 100MB
    runtime: 0
    resources:
      cpu: 100m
      memory: 256Mi
    constraints:
      nodeNames:
      - anrg-9
    type: data
  - name: store-scan
    image: 192.168.1.163:5000/wl-multi-odag-task:latest
    command: *id008
    dependencies:
    - scan
    dataSize: 50MB
    runtime: 0
    resources:
      cpu: 100m
      memory: 256Mi
    constraints:
      nodeNames:
      - anrg-9
    type: data
  - name: store-source
    image: 192.168.1.163:5000/wl-multi-odag-task:latest
    command: *id009
    dependencies:
    - source
    dataSize: 100MB
    runtime: 0
    resources:
      cpu: 100m
      memory: 256Mi
    constraints:
      nodeNames:
      - anrg-9
    type: data
