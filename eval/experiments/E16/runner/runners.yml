# Warm runners for E16's iot and chain workloads (generated; see Dockerfile.iot).
# wl-runner-e11 is E11's task image (eval/experiments/E11/tasks/Dockerfile) rebuilt with
# the current SDK: wl-e11:latest predates wl.runner.
{
 "apiVersion": "apps/v1",
 "kind": "DaemonSet",
 "metadata": {
  "name": "wl-runner-iot",
  "namespace": "wl-system",
  "labels": {
   "wl.io/runner": "iot"
  }
 },
 "spec": {
  "selector": {
   "matchLabels": {
    "wl.io/runner": "iot"
   }
  },
  "template": {
   "metadata": {
    "labels": {
     "wl.io/runner": "iot"
    }
   },
   "spec": {
    "affinity": {
     "nodeAffinity": {
      "requiredDuringSchedulingIgnoredDuringExecution": {
       "nodeSelectorTerms": [
        {
         "matchExpressions": [
          {
           "key": "kubernetes.io/hostname",
           "operator": "In",
           "values": [
            "anrg-1",
            "anrg-3",
            "anrg-4",
            "anrg-5",
            "anrg-6",
            "anrg-7",
            "anrg-8",
            "anrg-9"
           ]
          }
         ]
        }
       ]
      }
     }
    },
    "containers": [
     {
      "name": "runner",
      "image": "192.168.1.163:5000/wl-runner-iot:latest",
      "imagePullPolicy": "Always",
      "command": [
       "python",
       "-m",
       "wl.runner",
       "--script",
       "/app/stage.py",
       "--cpus",
       "7.4"
      ],
      "env": [
       {
        "name": "NODE_NAME",
        "valueFrom": {
         "fieldRef": {
          "fieldPath": "spec.nodeName"
         }
        }
       }
      ],
      "ports": [
       {
        "containerPort": 8090,
        "name": "invoke"
       }
      ],
      "readinessProbe": {
       "httpGet": {
        "path": "/healthz",
        "port": 8090
       },
       "periodSeconds": 2
      },
      "volumeMounts": [
       {
        "name": "wl-outputs",
        "mountPath": "/data/wl-outputs"
       },
       {
        "name": "wl-shared",
        "mountPath": "/shared/wl-outputs"
       }
      ]
     }
    ],
    "volumes": [
     {
      "name": "wl-outputs",
      "hostPath": {
       "path": "/data/wl-outputs",
       "type": "DirectoryOrCreate"
      }
     },
     {
      "name": "wl-shared",
      "hostPath": {
       "path": "/shared/wl-outputs",
       "type": "DirectoryOrCreate"
      }
     }
    ]
   }
  }
 }
}
