apiVersion: wl.io/v1
kind: ODAGTemplate
metadata:
  name: e3risk
  namespace: wl-system
spec:
  description: 'E3 risk-aware replication: serve is a pod-less vertex; anrg-7 is a backup that runs no application pod.'
  scheduler: heft
  retention:
    maxRuns: 10
    data:
      policy: keepLatest
      keepRuns: 2
  defaults:
    runtime: 3
    dataSize: 1MB
  tasks:
  - name: produce
    image: 192.168.1.163:5000/wl-multi-odag-task:latest
    command: [python, task.py]
    dependencies: []
    dataSize: 300MB
    runtime: 30
    constraints:
      nodeNames: [anrg-3]
  - name: serve
    image: 192.168.1.163:5000/wl-multi-odag-task:latest
    command: [python, task.py]
    dependencies: [produce]
    dataSize: 300MB
    runtime: 0
    type: data
    constraints:
      nodeNames: [anrg-3]
  - name: consume
    image: 192.168.1.163:5000/wl-multi-odag-task:latest
    command: [python, task.py]
    dependencies: [serve]
    dataSize: 1MB
    runtime: 4
    constraints:
      nodeNames: [anrg-8]
  - name: report
    image: 192.168.1.163:5000/wl-multi-odag-task:latest
    command: [python, task.py]
    dependencies: [consume]
    dataSize: 1MB
    runtime: 2
    constraints:
      nodeNames: [anrg-9]
