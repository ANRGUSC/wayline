apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: odags.wl.io
spec:
  group: wl.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [tasks]
              properties:
                scheduler:
                  type: string
                  default: random
                  description: >
                    Scheduler to use. Four forms:
                    "random" / "heft" — compiled-in schedulers;
                    "saga/<name>" — a built-in SAGA algorithm (heft, cpop,
                    peft, minmin, maxmin, sufferage, ...);
                    "saga/<dotted.path.ClassName>" — ANY importable
                    saga.Scheduler subclass, so a scheduler developed and
                    validated in simulation runs here unmodified (make it
                    importable via WL_SAGA_PATH or WL_SAGA_EXTRA_PACKAGES on
                    the sidecar);
                    "http(s)://host:port" — any service implementing the
                    scheduler contract, in any language.
                    On failure of an external scheduler the controller falls
                    back to the built-in HEFT scheduler.
                schedulerConfig:
                  type: object
                  description: Tunable knobs for the scheduler.
                  properties:
                    enactOrder:
                      type: string
                      enum: ["", none, order, serial]
                      description: >
                        How much of an external scheduler's schedule to
                        enact. Default (none) enacts PLACEMENT ONLY:
                        dispatch is data-readiness driven, so independent
                        ready tasks on one node may run concurrently or
                        out of the scheduler's order. "order" starts tasks
                        on each node in the scheduler's predicted order;
                        "serial" additionally runs one task at a time per
                        node, the machine model classical DAG schedulers
                        assume. Claims about reproducing a scheduling
                        algorithm's behaviour require order or serial.
                    nodeOrder:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      description: >
                        Explicit per-node execution order
                        {node: [task, ...]}, for replaying a frozen
                        schedule without re-invoking a scheduler.
                        Enacted like enactOrder (default serial).
                    spreadEpsilon:
                      type: number
                      default: 0
                      minimum: 0
                      description: >
                        HEFT tie-breaking tolerance in seconds. Candidate nodes whose EFT is within
                        spreadEpsilon of the minimum EFT are treated as tied, and the least-loaded
                        node wins. 0 preserves strict HEFT (with least-loaded exact-tie break).
                    options:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                      description: >
                        Free-form key/value options passed to an external scheduler
                        as constructor keyword arguments (e.g. {alpha: 0.5}). Ignored
                        by the built-in schedulers.
                retryPolicy:
                  type: object
                  properties:
                    maxRetries:
                      type: integer
                      default: 3
                      minimum: 0
                realization:
                  type: array
                  description: >
                    Desired physical realization per intermediate object,
                    revisable on the LIVE run: external policies patch this
                    section and the controller reconciles the data plane
                    toward it (create copies by agent-to-agent push, evict
                    copies, change which copy serves future consumers). The
                    template's graph is the initial binding; entries here
                    override it per object without any graph change. Objects
                    are named by their producing task, or "task.output" for a named output.
                  items:
                    type: object
                    required: [object]
                    properties:
                      object:
                        type: string
                        description: Producing task whose output this governs.
                      copies:
                        type: array
                        description: >
                          Nodes that must hold a valid copy. Copies present
                          on other nodes are NOT removed unless listed in
                          evict (revisions are additive by default).
                        items:
                          type: string
                      servingCopy:
                        type: string
                        description: >
                          Node whose copy serves future consumer installs.
                          Empty keeps the producer's copy as the source.
                      evict:
                        type: array
                        description: Nodes whose copy must be removed.
                        items:
                          type: string
                tasks:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [name, image]
                    properties:
                      name:
                        type: string
                      type:
                        type: string
                        enum: [compute, data]
                        description: >-
                          Vertex kind in the physical DAG. "compute" (default)
                          runs the task's container. "data" holds/moves bytes
                          with no pod: the controller realizes it through the
                          data-agent (alias + push). A data vertex must have
                          exactly one dependency and at least one successor.
                      image:
                        type: string
                      outputs:
                        type: array
                        description: >
                          Named outputs. A task may emit several
                          semantically distinct, immutable objects via
                          send("<name>", data); each has identity
                          <run, task, name> (data-plane key
                          "task.name"), its own consumer set (see
                          inputs), and an independently revisable
                          realization. Omit for the single default
                          output.
                        items:
                          type: object
                          required: [name]
                          properties:
                            name:
                              type: string
                            dataSize:
                              type: string
                      inputs:
                        type: array
                        description: >
                          Which named object of a producer this task
                          consumes. Refines an entry in dependencies;
                          producers listed in dependencies without an
                          inputs entry supply their default output.
                        items:
                          type: object
                          required: [producer]
                          properties:
                            producer:
                              type: string
                            object:
                              type: string
                      cacheKey:
                        type: string
                        description: >-
                          Opt-in cross-run reuse. If a previous run produced
                          this task's output under the same key and the copy
                          is still installed, the task does not execute: the
                          controller pins it to the node holding the copy,
                          aliases the bytes under this run's name, and serves
                          consumers from there. Requires a data retention
                          policy that keeps run data (keepLatest/none).
                      command:
                        type: array
                        items:
                          type: string
                      args:
                        type: array
                        items:
                          type: string
                      dependencies:
                        type: array
                        items:
                          type: string
                        default: []
                      resources:
                        type: object
                        properties:
                          cpu:
                            type: string
                          memory:
                            type: string
                      dataSize:
                        type: string
                        description: Expected output data size, e.g. "100MB". Used by scheduler for communication cost estimation.
                      runtime:
                        type: integer
                        description: Expected runtime in seconds. Used by scheduler for makespan estimation.
                      env:
                        type: array
                        items:
                          type: object
                          required: [name]
                          properties:
                            name:
                              type: string
                            value:
                              type: string
                      constraints:
                        type: object
                        properties:
                          nodeNames:
                            type: array
                            items:
                              type: string
                            description: If set, scheduler will only place this task on one of these nodes.
                      volumes:
                        type: array
                        description: >
                          Pod-level volumes appended to the controller's base mounts
                          (wl-outputs, wl-shared). Each item is a standard K8s
                          corev1.Volume. Reserved names ("wl-outputs", "wl-shared")
                          are rejected at parse time.
                        items:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                      volumeMounts:
                        type: array
                        description: >
                          Container-level volume mounts appended to the controller's
                          base mounts. Each item is a standard K8s corev1.VolumeMount.
                          Names must match a declared volume (either user-defined or
                          controller-owned).
                        items:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                      securityContext:
                        type: object
                        description: >
                          Pod-level securityContext (supplementalGroups, runAsUser,
                          fsGroup, etc.). Applied verbatim as corev1.PodSecurityContext.
                        x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum: [Pending, Scheduling, Running, Succeeded, Failed, Degraded]
                objects:
                  type: array
                  description: >
                    Actual per-object copy state as reconciled by the
                    controller; the observable counterpart of
                    spec.realization. One entry per object with revisions.
                  items:
                    type: object
                    properties:
                      object:
                        type: string
                      copies:
                        type: array
                        items:
                          type: object
                          properties:
                            node:
                              type: string
                            state:
                              type: string
                              description: Installed / Transferring / Evicted.
                      servingCopy:
                        type: string
                tasks:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      phase:
                        type: string
                        enum: [Pending, Running, Succeeded, Failed]
                      state:
                        type: string
                        description: Granular task state reported by data-agent (Scheduled/Executing/Sending/DataReady/Done/Failed).
                      node:
                        type: string
                      cachedFrom:
                        type: string
                        description: >-
                          For a cache-satisfied task: "<odag>/<task>" of the
                          prior run's output this task was aliased from.
                      podName:
                        type: string
                      startTime:
                        type: string
                        format: date-time
                      completionTime:
                        type: string
                        format: date-time
                      retries:
                        type: integer
                      message:
                        type: string
                      sending:
                        type: boolean
                        description: True while the background data transfer thread is active.
                      dataSize:
                        type: string
                        description: Output data size in bytes (parsed from spec.tasks[].dataSize).
                      createdTime:
                        type: string
                        format: date-time
                        description: When the controller created this task's pod.
                      inputsReadyTime:
                        type: string
                        format: date-time
                        description: >
                          When the last dependency's output finished installing on this
                          task's node, i.e. when the data-readiness gate opened. Unset
                          for source tasks and when any dependency's install record is
                          missing.
                      startupSeconds:
                        type: number
                        description: >
                          Pod creation to pod start: scheduling, image pull, sandbox
                          creation. Overhead no scheduling model accounts for.
                          Second-granularity (Kubernetes pod timestamps); use
                          taskStartTime for sub-second boundaries.
                      taskStartTime:
                        type: string
                        format: date-time
                        description: >
                          When the task's own code began (SDK init), sub-millisecond.
                          The gap from startTime is interpreter boot and imports.
                      taskCloseTime:
                        type: string
                        format: date-time
                        description: >
                          When the task called close(). The gap to completionTime is
                          pod teardown.
                      computeSeconds:
                        type: number
                        description: >
                          Time between the last input read and the first output handoff,
                          reported by the SDK. This is the quantity a scheduler's cost
                          model predicts. Absent for images predating the instrumented SDK.
                      inputReadSeconds:
                        type: number
                        description: Time spent reading dependency outputs from local storage.
                      handoffSeconds:
                        type: number
                        description: >
                          Time for the local atomic install of this task's output
                          (send() blocking phase); remote delivery continues after.
                startTime:
                  type: string
                  format: date-time
                completionTime:
                  type: string
                  format: date-time
                makespan:
                  type: number
                  description: Actual makespan in seconds (set on completion).
                message:
                  type: string
                predictedTasks:
                  type: array
                  description: Per-task predicted schedule computed at deployment time.
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      node:
                        type: string
                      estStart:
                        type: number
                        description: Estimated start time in seconds from t=0.
                      estEnd:
                        type: number
                        description: Estimated finish time in seconds from t=0.
                predictedNetworkFlows:
                  type: array
                  description: Per-edge predicted network transfers under TCP fair-sharing contention.
                  items:
                    type: object
                    properties:
                      fromTask:
                        type: string
                      toTask:
                        type: string
                      srcNode:
                        type: string
                      dstNode:
                        type: string
                      start:
                        type: number
                        description: Transfer start time in seconds from t=0.
                      end:
                        type: number
                        description: Transfer end time in seconds from t=0.
                      dataSize:
                        type: integer
                        description: Bytes transferred.
                        format: int64
                actualNetworkFlows:
                  type: array
                  description: Per-push observed network transfers recorded by the sender's data-agent.
                  items:
                    type: object
                    properties:
                      fromTask:
                        type: string
                      toTask:
                        type: string
                      srcNode:
                        type: string
                      dstNode:
                        type: string
                      start:
                        type: number
                        description: Observed wire start, seconds from ODAG startTime.
                      end:
                        type: number
                        description: Observed wire end, seconds from ODAG startTime.
                      dataSize:
                        type: integer
                        format: int64
                      ok:
                        type: boolean
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Scheduler
          type: string
          jsonPath: .spec.scheduler
        - name: Makespan
          type: number
          jsonPath: .status.makespan
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: odags
    singular: odag
    kind: ODAG
    shortNames:
      - odag
