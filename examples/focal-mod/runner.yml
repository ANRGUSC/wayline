# Warm runner for FOCAL's function stages: one per anrg worker, with torch,
# numpy and the FOCAL model loaded before the zygote forks, so a call starts
# with the model in memory.
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: wl-runner-focal
  namespace: wl-system
  labels: {wl.io/runner: focal}
spec:
  selector:
    matchLabels: {wl.io/runner: focal}
  template:
    metadata:
      labels: {wl.io/runner: focal}
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values: [anrg-1, anrg-3, anrg-4, anrg-5, anrg-6, anrg-7, anrg-8, anrg-9]
      containers:
      - name: runner
        image: 192.168.1.163:5000/wl-focal:latest
        imagePullPolicy: Always
        command: [python, -m, wl.runner, --script, /app/stage.py, --preload, "torch,numpy,focal_stages", --cpus, "7.4"]
        env:
        - {name: NODE_NAME, valueFrom: {fieldRef: {fieldPath: spec.nodeName}}}
        - {name: FOCAL_PRELOAD, value: "1"}
        ports:
        - {containerPort: 8090, name: invoke}
        readinessProbe:
          httpGet: {path: /healthz, port: 8090}
          periodSeconds: 2
        volumeMounts:
        - {name: wl-outputs, mountPath: /data/wl-outputs}
        - {name: wl-shared, mountPath: /shared/wl-outputs}
      volumes:
      - name: wl-outputs
        hostPath: {path: /data/wl-outputs, type: DirectoryOrCreate}
      - name: wl-shared
        hostPath: {path: /shared/wl-outputs, type: DirectoryOrCreate}
