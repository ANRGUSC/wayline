apiVersion: apps/v1
kind: Deployment
metadata:
  name: odag-controller
  namespace: wl-system
  labels:
    app: odag-controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: odag-controller
  template:
    metadata:
      labels:
        app: odag-controller
      annotations:
        # Keep `kubectl logs/exec deploy/odag-controller` targeting the
        # controller now that the pod also carries the saga-sidecar.
        kubectl.kubernetes.io/default-container: odag-controller
    spec:
      serviceAccountName: odag-controller
      tolerations:
        - key: node.kubernetes.io/unschedulable
          operator: Exists
          effect: NoSchedule
      nodeSelector:
        kubernetes.io/hostname: anrg-2
      containers:
        - name: odag-controller
          image: 192.168.1.163:5000/wl-odag-controller:latest
          imagePullPolicy: Always
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              # 256Mi was sized for the 7-18 task DAGs of the mechanism
              # experiments. A 100-task workflow with 100 pod-less data
              # vertices (E6 Part A) OOMKilled the controller mid-run,
              # which silently orphaned the run: the in-memory schedule
              # plan and assignment caches die with the process and the
              # surviving ODAG never dispatches its remaining tasks.
              memory: "1Gi"
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: WL_PROFILER_DB
              value: /data/wl-profiler.db
          volumeMounts:
            - name: profiler-data
              mountPath: /data
        # SAGA scheduler sidecar: serves spec.scheduler = "saga/<algo>".
        # The controller reaches it over the shared pod network at
        # 127.0.0.1:8090 and falls back to built-in HEFT if it is down.
        - name: saga-sidecar
          image: 192.168.1.163:5000/wl-saga-sidecar:latest
          imagePullPolicy: Always
          env:
            # Reproducible scheduling. Python randomizes str hashing per
            # process, so any set iteration over task or node names breaks
            # ties differently in each sidecar process. That makes a
            # scheduler's output depend on when its container last
            # restarted: identical requests returned different (and
            # sometimes better-scoring) schedules across restarts, which
            # silently invalidates any frozen-schedule replay or
            # run-to-run comparison. Pinning the seed makes the same
            # request yield the same schedule.
            - name: PYTHONHASHSEED
              value: "0"
            # Bring-your-own-scheduler. Either (or both) makes an external
            # saga.Scheduler subclass importable, so spec.scheduler can name
            # it by dotted path without rebuilding this image:
            #   WL_SAGA_PATH            dirs added to sys.path (mount a
            #                           ConfigMap or PVC holding a package)
            #   WL_SAGA_EXTRA_PACKAGES  pip requirements installed at startup
            #                           (e.g. "git+https://github.com/you/sched")
            - name: WL_SAGA_PATH
              value: "/opt/wl-schedulers"
            - name: WL_SAGA_EXTRA_PACKAGES
              value: ""
          volumeMounts:
            - name: user-schedulers
              mountPath: /opt/wl-schedulers
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "1"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8090
            initialDelaySeconds: 3
            periodSeconds: 10
      volumes:
        - name: profiler-data
          hostPath:
            path: /var/lib/wayline
            type: DirectoryOrCreate
        # Drop-in location for user scheduler packages. Optional by
        # construction: an absent ConfigMap yields an empty directory, the
        # sidecar logs it and carries on with the built-ins.
        - name: user-schedulers
          configMap:
            name: wl-user-schedulers
            optional: true
